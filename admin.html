<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>Painel administrativo — Mapeamento Práticas Ancestrais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { background: var(--lino-soft); }
  .admin-header {
    background: var(--anil); color: var(--lino);
    padding: 16px 6vw; display: flex; align-items: center; justify-content: space-between;
  }
  .admin-header .brand-txt { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; }
  .admin-header .brand-txt span { color: var(--dourado); font-style: italic; font-weight: 400; }
  #logoutBtn {
    background: transparent; border: 1px solid rgba(234,226,206,.35); color: var(--lino);
    padding: 8px 16px; border-radius: 4px; font-size: .85rem; cursor: pointer; display: none;
  }

  /* ---- login ---- */
  .login-wrap { max-width: 380px; margin: 12vh auto; padding: 0 6vw; }
  .login-card { background: var(--card-bg); border: 1px solid rgba(42,33,21,.10); border-radius: 12px; padding: 36px 30px; }
  .login-card h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.4rem; margin-bottom: 6px; }
  .login-card p.sub { color: #7a6d54; font-size: .88rem; margin-bottom: 24px; }
  .login-card .form-field { margin-bottom: 16px; }
  .login-card label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 5px; }
  .login-card input {
    width: 100%; padding: 11px 13px; border: 1px solid rgba(42,33,21,.18); border-radius: 6px;
    font-family: 'Work Sans', sans-serif; font-size: .92rem; background: var(--lino-soft); color: var(--tinta);
  }
  #loginError { color: var(--barro-dark); font-size: .85rem; margin-top: 10px; display: none; }

  /* ---- dashboard ---- */
  #dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 30px 6vw 90px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 26px; }
  .tab-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: .9rem;
    padding: 10px 20px; border-radius: 20px; border: 1.5px solid rgba(42,33,21,.2);
    background: transparent; color: var(--tinta); cursor: pointer;
  }
  .tab-btn.active { background: var(--barro); border-color: var(--barro); color: var(--lino); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .item-card {
    background: var(--card-bg); border: 1px solid rgba(42,33,21,.10); border-radius: 10px;
    padding: 22px; margin-bottom: 18px;
  }
  .item-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .status-badge { font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .status-badge.pendente { background: var(--barro-tint); color: var(--barro-dark); }
  .status-badge.aprovado { background: var(--oliva-tint); color: var(--oliva); }
  .status-badge.rejeitado { background: #e5e0d5; color: #7a6d54; }
  .status-badge.recebida { background: var(--barro-tint); color: var(--barro-dark); }
  .status-badge.em_analise { background: #f1e6c8; color: #8a6d1f; }
  .status-badge.arquivada { background: #e5e0d5; color: #7a6d54; }
  .status-badge.publicada { background: var(--oliva-tint); color: var(--oliva); }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .field-grid.full { grid-template-columns: 1fr; }
  .f label { display: block; font-size: .74rem; font-weight: 600; color: #7a6d54; margin-bottom: 4px; }
  .f input, .f select, .f textarea {
    width: 100%; padding: 9px 11px; border: 1px solid rgba(42,33,21,.16); border-radius: 5px;
    font-family: 'Work Sans', sans-serif; font-size: .88rem; background: var(--lino-soft); color: var(--tinta);
  }
  .f textarea { min-height: 70px; resize: vertical; }

  .foto-slot-group { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .foto-slot { display: flex; flex-direction: column; gap: 6px; }
  .foto-slot img { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(42,33,21,.12); }
  .foto-slot .no-foto { width: 120px; height: 90px; display: flex; align-items: center; justify-content: center; background: var(--lino); border-radius: 6px; font-size: .68rem; color: #9c8f76; text-align: center; }
  .foto-upload-label { font-size: .72rem; color: var(--barro); cursor: pointer; text-decoration: underline; width: 120px; }
  .foto-upload-label input[type="file"] { display: block; margin-top: 4px; font-size: .68rem; width: 120px; }

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .abtn { font-size: .82rem; font-weight: 600; padding: 9px 16px; border-radius: 5px; border: none; cursor: pointer; }
  .abtn-save { background: var(--tinta); color: var(--lino); }
  .abtn-aprovar { background: var(--oliva); color: #fff; }
  .abtn-rejeitar { background: transparent; color: var(--barro-dark); border: 1px solid var(--barro-dark); }
  .abtn-excluir { background: transparent; color: #a34; border: 1px solid rgba(163,68,68,.4); margin-left: auto; }
  .save-msg { font-size: .78rem; color: var(--oliva); display: none; }
  .panel-toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }

  .empty-note { color: #8a7d64; font-size: .9rem; text-align: center; padding: 40px 0; }
  .relato-box { background: var(--lino-soft); border-radius: 6px; padding: 14px; font-size: .9rem; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; }

  @media (max-width: 640px) {
    .field-grid { grid-template-columns: 1fr; }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <header class="admin-header">
    <div class="brand-txt">Mapeamento <span>Práticas Ancestrais</span> — Painel</div>
    <button id="logoutBtn">Sair</button>
  </header>

  <!-- ============ LOGIN ============ -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <h1>Entrar</h1>
      <p class="sub">Acesso restrito à equipe do GEERS.</p>
      <form id="loginForm">
        <div class="form-field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-field">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" required>
        </div>
        <button type="submit" class="btn btn-fill" style="width:100%; cursor:pointer;">Entrar</button>
        <p id="loginError"></p>
      </form>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="dashboard">
    <div class="tabs">
      <button class="tab-btn active" data-tab="terreiros">Terreiros</button>
      <button class="tab-btn" data-tab="denuncias">Denúncias</button>
    </div>

    <div class="tab-panel active" id="panel-terreiros">
      <div class="panel-toolbar">
        <button id="novoTerreiroBtn" class="btn btn-fill" style="cursor:pointer;">+ Novo terreiro</button>
      </div>
      <div id="terreirosList"></div>
    </div>

    <div class="tab-panel" id="panel-denuncias">
      <div id="denunciasList"></div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/endereco-picker.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
